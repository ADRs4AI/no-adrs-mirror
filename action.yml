# Name form ruled by Mint №92 addendum (2026-10-19, the founder's own lean):
# hyphenated everywhere the tool is NAMED — the raw mark, undressed (the dress
# lives in description:). Spaced form survives only as generic prose for the
# artifact class: "a no-ADRs mirror of your repository".
name: "no-adrs-mirror"
# Marketplace caps this field at 125 characters (validator, 2026-10-19);
# the depth lives in the README. Dress register per Mint's №92 mechanics.
description: >-
  Publish a repository's code to a mirror without its deliberation record —
  the withholding declared in a generated notice.
author: "ADRs4AI (engine: Covenant 5, 2026-08-26; productionized 2026-10-13 at the rights-holder's word)"

# Ratified by the rights-holder 2026-10-18 (ADR-0003 QST-BRANDING; Pharos coin,
# Mint №99 confirm). Feather set: `book` is the CLOSED book here — verify pixels,
# never names, if the set ever changes (the Octicons same-name trap, engraved).
branding:
  icon: "book"
  color: "blue"

inputs:
  mirror_repo:
    description: "Target owner/repo. Default: this repo's name with the -no-adrs suffix."
    required: false
    default: "${{ github.repository }}-no-adrs"
  token:
    description: >-
      Token able to push to (and, with create_if_missing, create) the mirror repo.
      The default GITHUB_TOKEN cannot push to another repository — pass a PAT
      or a GitHub App token stored as a secret.
    required: true
  strip_paths:
    description: "Newline-separated paths/globs to withhold. Default: the record + the deliberative apparatus."
    required: false
    default: |
      docs/adr
      docs/inbox
      docs/vignettes
      docs/handoffs
      docs/continuity
      docs/HANDOFF-*.md
      CLAUDE.md
      AGENTS.md
      .claude
      .pneumatic
      .working
      .mcp.json
  additional_strip_paths:
    description: >-
      Newline-separated paths/globs ADDED to the strip list (additive — never
      replaces the defaults or strip_paths; use this to withhold more without
      re-declaring the whole list).
    required: false
    default: ""
  approved_paths:
    description: >-
      Fail-closed path consent (ADR-0001 QST-SYNC-CONSENT, answer B):
      newline-separated roots that kept files MAY live under. Any kept path
      outside every root stops the build before anything is written. Required
      once the mirror is PUBLIC: a public mirror with no approved_paths fails
      the push step and prints the roots it would need — approve them
      deliberately, once, and new paths can never ride a sync unreviewed.
    required: false
    default: ""
  history_mode:
    description: "snapshot (one commit, no history — no message leaks) | filter (git filter-repo: code history kept, record-only commits pruned WITH their messages; mixed commits survive)"
    required: false
    default: "snapshot"
  message_mode:
    description: >-
      filter mode only: map (model-written one-liners from message_map, mechanical
      fallback) | redact (original subjects, dictionary tokens replaced — needs
      redact_dict) | mechanical (type + changed paths; deterministic) | scrub
      (constant line) | subject (first line only) | keep. Degrade law: a commit
      the map does not cover degrades DOWN in warmth (to mechanical), never to
      its original text; a missing or unreadable companion FILE fails the build
      (fail-closed — a config typo must not silently change the output).
      Default is scrub: measured on our own repositories, even code-only commit
      SUBJECTS carry deliberation — subject is offered for repos
      with disciplined terse subjects, never as the honest default.
    required: false
    default: "scrub"
  message_map:
    description: "message_mode=map: path (in the source repo) to the JSON map {original_sha: neutral line}"
    required: false
    default: ""
  redact_dict:
    description: "message_mode=redact: path (in the source repo) to the dictionary JSON from `mirror.py dictgen`"
    required: false
    default: ""
  digest:
    description: "none | index (one DELIBERATIONS-DIGEST.md) | per-adr (index + docs/deliberations-digest/<adr>.md)"
    required: false
    default: "none"
  digest_model:
    description: "Model for digests."
    required: false
    default: "claude-sonnet-5"
  digest_effort:
    description: "low | medium | high | xhigh | max"
    required: false
    default: "medium"
  digest_prompt:
    description: "Path (in the source repo) to a prompt file overriding the action's prompts/adr-digest.md"
    required: false
    default: ""
  digest_glob:
    description: "Which files get digested"
    required: false
    default: "docs/adr/[0-9]*.md"
  digest_style:
    description: "full | brief — brief writes the ADR index summary: one-sentence bullets per record"
    required: false
    default: "full"
  digest_prompt_text:
    description: >-
      Inline prompt string; wins over digest_prompt. Prefer this for
      customization — it is self-contained and versioned with your workflow,
      where a file path must exist in the source tree.
    required: false
    default: ""
  anthropic_api_key:
    description: "Required when digest != none. Store as a secret."
    required: false
    default: ""
  disable_workflows:
    description: >-
      Newline-separated workflow filenames to move to
      .github/workflows-disabled/ in the mirror (publish/release workflows
      that need secrets the mirror does not hold). Test/lint workflows should
      stay live — green checks on public code are part of the trust story.
    required: false
    default: ""
  terms:
    description: "One sentence for DELIBERATIONS-NOTICE.md: under what terms / from whom the record is available"
    required: false
    default: "Access to the record is governed by the source repository's maintainers; its license is decided separately from this code's."
  create_if_missing:
    description: >-
      Create the mirror repo with gh if it does not exist — PRIVATE, always.
      Making a mirror public is a visibility act reserved to the repo owner's
      own explicit, per-repo decision; this action deliberately offers no way
      to do it. Build everything up to the flip; the flip is human.
    required: false
    default: "false"
  dry_run:
    description: "Build only; upload the tree as a workflow artifact instead of pushing"
    required: false
    default: "false"
  python_version:
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    # SECURITY (S1, Shipwright review 2026-10-17): every input reaches the
    # shell ONLY via env — `${{ inputs.* }}` inside a run: block is textual
    # substitution and a composite-action injection vector (the house's own
    # quote() class, Actions costume). Defense uniform: all inputs, even
    # enum-shaped ones, no exceptions to audit later.
    - name: Install tooling
      shell: bash
      env:
        HISTORY_MODE: ${{ inputs.history_mode }}
        DIGEST: ${{ inputs.digest }}
      run: |
        python -m pip install --quiet --upgrade pip
        if [ "$HISTORY_MODE" = "filter" ]; then python -m pip install --quiet git-filter-repo; fi
        if [ "$DIGEST" != "none" ]; then python -m pip install --quiet anthropic; fi

    - name: Build the mirror tree
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        HISTORY_MODE: ${{ inputs.history_mode }}
        MESSAGE_MODE: ${{ inputs.message_mode }}
        DRY_RUN: ${{ inputs.dry_run }}
        MESSAGE_MAP: ${{ inputs.message_map }}
        REDACT_DICT: ${{ inputs.redact_dict }}
        DIGEST: ${{ inputs.digest }}
        DIGEST_MODEL: ${{ inputs.digest_model }}
        DIGEST_EFFORT: ${{ inputs.digest_effort }}
        DIGEST_GLOB: ${{ inputs.digest_glob }}
        DIGEST_PROMPT: ${{ inputs.digest_prompt }}
        DIGEST_STYLE: ${{ inputs.digest_style }}
        DIGEST_PROMPT_TEXT: ${{ inputs.digest_prompt_text }}
        STRIP_PATHS: ${{ inputs.strip_paths }}
        ADDITIONAL_STRIP_PATHS: ${{ inputs.additional_strip_paths }}
        APPROVED_PATHS: ${{ inputs.approved_paths }}
        DISABLE_WORKFLOWS: ${{ inputs.disable_workflows }}
        TERMS: ${{ inputs.terms }}
      run: |
        set -euo pipefail
        args=(build --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/mirror" \
              --history "$HISTORY_MODE" --messages "$MESSAGE_MODE" \
              --digest "$DIGEST" --digest-model "$DIGEST_MODEL" \
              --digest-effort "$DIGEST_EFFORT" --digest-glob "$DIGEST_GLOB" \
              --digest-style "$DIGEST_STYLE" --digest-prompt-text "$DIGEST_PROMPT_TEXT" \
              --repo-slug "$GITHUB_REPOSITORY" --terms "$TERMS")
        while IFS= read -r p; do [ -n "$p" ] && args+=(--strip "$p"); done <<< "$STRIP_PATHS"
        while IFS= read -r p; do [ -n "$p" ] && args+=(--additional-strip "$p"); done <<< "$ADDITIONAL_STRIP_PATHS"
        while IFS= read -r p; do [ -n "$p" ] && args+=(--approved-root "$p"); done <<< "$APPROVED_PATHS"
        while IFS= read -r w; do [ -n "$w" ] && args+=(--disable-workflow "$w"); done <<< "$DISABLE_WORKFLOWS"
        if [ -n "$DIGEST_PROMPT" ]; then args+=(--digest-prompt "$GITHUB_WORKSPACE/$DIGEST_PROMPT"); fi
        if [ -n "$MESSAGE_MAP" ]; then args+=(--message-map "$GITHUB_WORKSPACE/$MESSAGE_MAP"); fi
        if [ -n "$REDACT_DICT" ]; then args+=(--redact-dict "$GITHUB_WORKSPACE/$REDACT_DICT"); fi
        # A preview must not egress: dry_run stages digest prompts instead of
        # calling the model (Sounder 6's boundary finding, 2026-10-19).
        if [ "$DRY_RUN" = "true" ]; then args+=(--digest-dry-run); fi
        python "${{ github.action_path }}/mirror.py" "${args[@]}" | tee "$RUNNER_TEMP/mirror-report.json"

    - name: Upload (dry run)
      if: ${{ inputs.dry_run == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: no-adrs-mirror
        path: ${{ runner.temp }}/mirror
        # Without this the artifact silently omits dotfiles AND the rewritten
        # .git history — the exact things a preview exists to let you inspect
        # (Sounder 6's artifact finding, 2026-10-19; upstream default is false).
        include-hidden-files: true

    - name: Push to the mirror
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MIRROR_REPO: ${{ inputs.mirror_repo }}
        CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
        APPROVED_PATHS: ${{ inputs.approved_paths }}
      run: |
        set -euo pipefail
        # Fail-closed bootstrap (QST-SYNC-CONSENT B): a PUBLIC mirror with no
        # declared approved_paths never receives a push — the step fails and
        # prints exactly the roots a deliberate approval would need. Private
        # mirrors stay ungated (staging freedom; publication is the boundary).
        priv="$(gh api "repos/$MIRROR_REPO" --jq .private 2>/dev/null || echo true)"
        if [ "$priv" = "false" ] && [ -z "$(printf '%s' "$APPROVED_PATHS" | tr -d '[:space:]')" ]; then
          tops="$(cd "$RUNNER_TEMP/mirror" && ls -A | grep -v '^\.git$' | sort | tr '\n' ' ')"
          {
            echo "**Push stopped (fail-closed)**: the mirror \`$MIRROR_REPO\` is PUBLIC and no \`approved_paths\` are declared."
            echo ""
            echo "Review the built tree (run once with \`dry_run: \"true\"\`), then declare the roots you approve — this build's top-level entries: \`$tops\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::public mirror without approved_paths — declare the roots (this build's tops: $tops)"
          exit 1
        fi
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        create=""; [ "$CREATE_IF_MISSING" = "true" ] && create="--create"
        python "${{ github.action_path }}/mirror.py" push --out "$RUNNER_TEMP/mirror" --mirror "$MIRROR_REPO" $create
